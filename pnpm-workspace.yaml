packages:
  - examples/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.3.0
  vitest: ^4.1.11
  vite-plus: ^0.3.0
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    react: '*'
    react-dom: '*'
    vite: '*'
    vitest: '*'
